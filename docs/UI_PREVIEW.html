<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>PakScope · 包览 — 界面方案预览</title>
<style>
:root{color-scheme:light;--bg:#f7f9fd;--panel:#fff;--sidebar:#f2f5fb;--ink:#1d293c;--muted:#8290a4;--line:#e7ebf3;--primary:#5566dc;--primary-weak:#e5eafd;--blue:#526bec;--green:#10a994;--violet:#8a72da;--orange:#dc9050;--shadow:0 8px 26px rgba(35,57,93,.035)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Noto Sans CJK SC","Microsoft YaHei",-apple-system,BlinkMacSystemFont,sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #8294ed;outline-offset:2px}.frame{display:flex;min-height:100vh}.sidebar{width:246px;flex:0 0 246px;background:var(--sidebar);padding:28px 17px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:8px}.identity{display:flex;align-items:center;gap:13px;padding:0 9px 33px}.brandmark{width:45px;height:45px;border-radius:15px;background:linear-gradient(145deg,#566cf2,#2cb7a8);color:white;display:grid;place-items:center;box-shadow:0 6px 16px rgba(65,99,204,.18)}.brandname{font-size:17px;font-weight:850;letter-spacing:.7px}.slogan{font-size:11px;color:var(--muted);margin-top:4px}.menu-title{font-size:11px;font-weight:750;letter-spacing:1px;color:var(--muted);padding:8px 15px;margin-top:6px}.sidebtn{border:0;background:transparent;width:100%;text-align:left;border-radius:13px;padding:13px 15px;color:var(--ink);display:flex;gap:13px;align-items:center;font-size:13px;font-weight:650}.sidebtn svg{width:19px;height:19px;opacity:.75}.sidebtn:hover{background:rgba(85,102,220,.065)}.sidebtn.active{background:#e0e7fc;color:#475ed2}.filler{flex:1}.build-tag{font-size:12px;color:var(--muted);padding-left:12px}.sidebar-tip{background:rgba(90,112,218,.06);border-radius:16px;padding:16px;line-height:1.65;font-size:12px;color:var(--muted);margin-top:16px}.sidebar-tip strong{color:var(--ink);display:block;margin-bottom:5px}.shell{flex:1;min-width:0}.topbar{height:78px;display:flex;align-items:center;justify-content:space-between;padding:0 37px;border-bottom:1px solid var(--line);background:var(--panel)}.top-title{font-size:18px;font-weight:780}.top-sub{font-size:11px;color:var(--muted);margin-top:4px}.toolbar{display:flex;align-items:center;gap:12px}.preview-pill{border-radius:40px;padding:7px 11px;color:#5e6bd2;background:var(--primary-weak);font-size:11px;font-weight:700}.iconbtn{width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:11px}.iconbtn svg{width:18px}.main{max-width:1240px;padding:28px 37px 40px;margin:auto}.hero{border-radius:25px;background:linear-gradient(112deg,#dfe7ff,#e8f7f4);border:1px solid #d7e1f8;min-height:165px;padding:29px 32px;display:flex;align-items:center;justify-content:space-between;gap:18px;overflow:hidden}.hero h1{font-size:27px;letter-spacing:-.8px;margin:0 0 10px;font-weight:850;color:#243d65}.hero p{margin:0;color:#67809e;font-size:13px}.scan-dot{display:inline-block;background:#2eb89f;width:7px;height:7px;border-radius:50%;margin-right:6px}.hero-status{margin-top:20px;color:#427dc0;font-size:12px;font-weight:750}.hero-icon{display:grid;place-items:center;flex:0 0 105px;height:105px;border-radius:24px;background:rgba(255,255,255,.48);color:#5b80e2;transform:rotate(-10deg)}.hero-icon svg{height:66px;width:66px;stroke-width:1.7}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px;margin:19px 0 29px}.card{min-height:117px;border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:20px 20px 14px;box-shadow:var(--shadow);position:relative}.card:before{content:"";position:absolute;left:19px;top:0;width:43px;height:3px;border-radius:0 0 5px 5px;background:var(--accent)}.cardhead{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;font-weight:700}.cardhead svg{width:20px;color:var(--accent)}.cardvalue{font-size:34px;letter-spacing:-1px;font-weight:850;margin-top:6px}.sectionrow{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:13px}.sectionrow h2{font-size:19px;margin:0;font-weight:780}.muted{color:var(--muted);font-size:12px}.searchrow{display:flex;gap:11px;margin-bottom:15px}.searchbox{flex:1;position:relative}.searchbox svg{position:absolute;width:19px;top:13px;left:14px;color:#98a6bb}.searchbox input{width:100%;padding:13px 15px 13px 44px;background:var(--panel);border:1px solid var(--line);border-radius:13px;color:var(--ink);outline:none;font-size:13px}.searchrow select{padding:0 13px;min-width:145px;border:1px solid var(--line);border-radius:13px;background:var(--panel);color:var(--ink);font-size:12px}.items{border-radius:19px;background:var(--panel);border:1px solid var(--line);overflow:hidden;box-shadow:var(--shadow)}.item{display:flex;align-items:center;gap:17px;padding:14px 19px;cursor:pointer;border-top:1px solid var(--line);transition:background .15s}.item:first-child{border-top:0}.item:hover{background:rgba(84,102,213,.055)}.appicon{width:47px;height:47px;flex:0 0 47px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:20px;color:white;background:var(--color)}.appmeta{flex:1;min-width:0}.appname{font-size:14px;font-weight:730;margin:0 0 7px}.appdetail{font-size:11px;color:var(--muted);white-space:nowrap;text-overflow:ellipsis;overflow:hidden}.tag{font-size:10px;font-weight:800;border-radius:30px;padding:7px 10px;color:var(--tag-color);background:var(--tag-bg);white-space:nowrap}.chevron{font-size:21px;color:#9da9bb;margin-left:8px}.footer{display:flex;gap:7px;align-items:center;color:var(--muted);font-size:11px;margin-top:16px}.footer svg{width:14px}.overlay{position:fixed;inset:0;background:rgba(15,28,54,.38);backdrop-filter:blur(4px);display:none;justify-content:flex-end;z-index:99}.overlay.show{display:flex}.drawer{width:min(520px,100%);height:100%;overflow:auto;background:var(--panel);padding:32px;box-shadow:-16px 0 50px rgba(10,20,30,.13)}.drawerhead{display:flex;justify-content:space-between;gap:12px;align-items:start;margin-bottom:25px}.drawer h2{margin:0 0 7px;font-size:23px}.detailfield{padding:15px 0;border-bottom:1px solid var(--line)}.detailfield small{color:var(--muted);display:block;margin-bottom:8px}.detailfield div{font-size:13px;line-height:1.6;word-break:break-all}.drawer-note{padding:13px;border-radius:13px;background:var(--primary-weak);color:var(--primary);font-size:12px;margin-top:22px;line-height:1.7}.empty{text-align:center;padding:42px;color:var(--muted)}
.dark{color-scheme:dark;--bg:#121824;--panel:#1c2636;--sidebar:#151e2d;--ink:#e6edf8;--muted:#91a0b7;--line:#2b3749;--primary:#a2b0ff;--primary-weak:#293459;--shadow:none}.dark .hero{background:linear-gradient(115deg,#283763,#1c4b50);border-color:#314866}.dark .hero h1{color:#e2eaff}.dark .hero p{color:#b0c3d9}.dark .sidebtn.active{background:#29375e;color:#b3c3ff}.dark .hero-icon{background:rgba(255,255,255,.06);color:#9bbdff}.dark .appdetail{color:#a8b3c5}
@media(max-width:850px){.sidebar{width:76px;flex-basis:76px;padding:24px 11px}.sidebar .brandname,.sidebar .slogan,.sidebar .menu-title,.sidebar .sidebtn span,.sidebar .build-tag,.sidebar .sidebar-tip{display:none}.identity{padding:0 2px 25px}.sidebtn{justify-content:center;padding:15px 6px}.main{padding:21px}.topbar{padding:0 22px}}
@media(max-width:600px){.cards{gap:9px}.card{padding:13px;min-height:90px}.cardvalue{font-size:25px}.hero{padding:20px}.hero h1{font-size:21px}.hero-icon{display:none}.top-sub{display:none}.cardhead{font-size:10px}.item{gap:9px;padding:12px}.appicon{width:39px;height:39px;flex-basis:39px}.searchrow select{min-width:105px}.chevron{display:none}}
</style>
</head>
<body>
<svg style="display:none" xmlns="http://www.w3.org/2000/svg"><symbol id="i-pack" viewBox="0 0 24 24"><path d="m3 7 9-4 9 4v10l-9 4-9-4V7Zm0 0 9 5 9-5m-9 5v9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol><symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></symbol><symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v9H3V7Z" fill="none" stroke="currentColor" stroke-width="1.7"/></symbol><symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.4" fill="none" stroke="currentColor" stroke-width="2"/><path d="m15.3 15.3 5.1 5.1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol><symbol id="i-shield" viewBox="0 0 24 24"><path d="m12 2 8 4v6c0 5-3 8-8 10-5-2-8-5-8-10V6l8-4Z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="m8 12 3 3 5-6" fill="none" stroke="currentColor" stroke-width="1.7"/></symbol><symbol id="i-disk" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.7"/></symbol></svg>
<div class="frame">
<aside class="sidebar"><div class="identity"><div class="brandmark"><svg width="28" height="28"><use href="#i-pack"/></svg></div><div><div class="brandname">PAKSCOPE</div><div class="slogan">包览 · 软件资产中心</div></div></div><div class="menu-title">应用来源</div><div id="sidebarButtons"></div><div class="filler"></div><div class="menu-title">当前版本</div><div class="build-tag">v0.1.0 · 只读预览</div><div class="sidebar-tip"><strong>安全卸载 · 即将加入</strong>卸载影响预览和残留管理将在后续版本中逐步提供。</div></aside>
<div class="shell"><header class="topbar"><div><div class="top-title">PakScope · 包览</div><div class="top-sub">让已安装的软件一目了然</div></div><div class="toolbar"><span class="preview-pill">交互设计预览 · 示例数据</span><button class="iconbtn" id="theme" aria-label="切换深色模式" title="切换深色模式">◐</button></div></header>
<main class="main"><section class="hero"><div><h1>认识你的每一款软件</h1><p>安装来源、版本信息、程序位置，一次看清。</p><div class="hero-status"><span class="scan-dot"></span> 已完成 · 本地只读扫描（演示状态）</div></div><div class="hero-icon"><svg><use href="#i-pack"/></svg></div></section>
<div class="cards"><section class="card" style="--accent:var(--blue)"><div class="cardhead">发现应用<svg><use href="#i-grid"/></svg></div><div class="cardvalue" id="statAll">0</div></section><section class="card" style="--accent:var(--violet)"><div class="cardhead">APT / DEB<svg><use href="#i-pack"/></svg></div><div class="cardvalue" id="statApt">0</div></section><section class="card" style="--accent:var(--green)"><div class="cardhead">其他来源<svg><use href="#i-disk"/></svg></div><div class="cardvalue" id="statOther">0</div></section></div>
<div class="sectionrow"><h2>已安装应用</h2><span class="muted" id="count"></span></div><div class="searchrow"><div class="searchbox"><svg><use href="#i-search"/></svg><input id="search" placeholder="搜索软件名称、包名、安装位置…" aria-label="搜索"></div><select id="filter" aria-label="安装来源"><option value="全部">全部来源</option><option>APT / DEB</option><option>Snap</option><option>Flatpak</option><option>AppImage</option><option>手动 / 未识别</option></select></div><div class="items" id="items"></div><div class="footer"><svg><use href="#i-shield"/></svg> 安全只读模式 · 不修改系统、不删除软件、不需要管理员权限</div>
</main></div></div>
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="应用详情"><div class="drawer"><div class="drawerhead"><div><h2 id="drawerTitle"></h2><span class="muted" id="drawerSource"></span></div><button class="iconbtn" id="close" title="关闭">✕</button></div><div id="detailFields"></div><div class="drawer-note">这是用于评审设计的演示数据。实际 PakScope 软件不会根据这些示例更改你的系统，也不会自动卸载程序。</div></div></div>
<script>
const apps=[{name:'WPS Office',id:'wps-office',version:'12.1.0',src:'APT / DEB',color:'#e64e59',mark:'W',path:'/usr/share/applications/'},{name:'Visual Studio Code',id:'code',version:'1.95.0',src:'APT / DEB',color:'#298fe2',mark:'⌘',path:'/usr/share/code/'},{name:'Firefox',id:'firefox',version:'138.0',src:'Snap',color:'#f08c39',mark:'◕',path:'/snap/firefox/current'},{name:'Obsidian',id:'md.obsidian.Obsidian',version:'1.8.1',src:'Flatpak',color:'#8467dc',mark:'O',path:'/var/lib/flatpak/app/md.obsidian.Obsidian'},{name:'AppImageLauncher Demo',id:'demo.AppImage',version:'—',src:'AppImage',color:'#25ac95',mark:'◆',path:'~/Applications/demo.AppImage'},{name:'Typora',id:'typora',version:'1.9.0',src:'APT / DEB',color:'#72859c',mark:'T',path:'/usr/share/applications/'},{name:'My Local Tool',id:'local-tool.desktop',version:'—',src:'手动 / 未识别',color:'#8994a5',mark:'M',path:'~/.local/share/applications/'}];
const sources=[['全部','i-grid'],['APT / DEB','i-pack'],['Snap','i-disk'],['Flatpak','i-folder'],['AppImage','i-pack'],['手动 / 未识别','i-folder']];
const side=document.getElementById('sidebarButtons');sources.forEach(([s,i])=>{let b=document.createElement('button');b.className='sidebtn'+(s==='全部'?' active':'');b.dataset.source=s;b.innerHTML=`<svg fill="none" stroke="currentColor"><use href="#${i}"/></svg><span>${s==='全部'?'全部应用':s}</span>`;b.onclick=()=>{document.getElementById('filter').value=s;render()};side.appendChild(b)});
function tagPalette(s){return {'APT / DEB':['#5970da','#e9edfe'],'Snap':['#9272d5','#f0eaff'],'Flatpak':['#209b88','#e1f6ed'],'AppImage':['#cc844c','#fff0dd'],'手动 / 未识别':['#8391a8','#e9edf3']}[s]}
function render(){let query=document.getElementById('search').value.trim().toLowerCase(),source=document.getElementById('filter').value;document.querySelectorAll('.sidebtn').forEach(b=>b.classList.toggle('active',b.dataset.source===source));let shown=apps.filter(a=>(source==='全部'||source===a.src)&&[a.name,a.id,a.path,a.version].join(' ').toLowerCase().includes(query));document.getElementById('count').textContent='找到 '+shown.length+' 个应用';document.getElementById('statAll').textContent=apps.length;document.getElementById('statApt').textContent=apps.filter(a=>a.src==='APT / DEB').length;document.getElementById('statOther').textContent=apps.filter(a=>a.src!=='APT / DEB').length;let box=document.getElementById('items');box.replaceChildren();if(!shown.length){box.innerHTML='<div class="empty">暂无匹配的软件，尝试换一个关键词。</div>';return}shown.forEach(app=>{let [fg,bg]=tagPalette(app.src);let row=document.createElement('div');row.className='item';row.tabIndex=0;row.setAttribute('role','button');row.innerHTML=`<div class="appicon" style="--color:${app.color}">${app.mark}</div><div class="appmeta"><div class="appname"></div><div class="appdetail"></div></div><span class="tag" style="--tag-color:${fg};--tag-bg:${bg}"></span><span class="chevron">›</span>`;row.querySelector('.appname').textContent=app.name;row.querySelector('.appdetail').textContent=app.id+' · '+app.version;row.querySelector('.tag').textContent=app.src;row.onclick=()=>openDetail(app);row.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openDetail(app)}};box.appendChild(row)})}
function openDetail(a){document.getElementById('drawerTitle').textContent=a.name;document.getElementById('drawerSource').textContent=a.src+' · 数据来自演示记录';let box=document.getElementById('detailFields');box.replaceChildren();[['软件包 / ID',a.id],['应用版本',a.version],['安装来源',a.src],['安装位置（演示）',a.path],['识别依据','此处仅为界面演示，真实版本将从本机扫描后填入']].forEach(([key,value])=>{let row=document.createElement('div');row.className='detailfield';let k=document.createElement('small');k.textContent=key;let v=document.createElement('div');v.textContent=value;row.append(k,v);box.appendChild(row)});document.getElementById('overlay').classList.add('show')}
function closeDetail(){document.getElementById('overlay').classList.remove('show')};document.getElementById('close').onclick=closeDetail;document.getElementById('overlay').onclick=e=>{if(e.target.id==='overlay')closeDetail()};document.onkeydown=e=>{if(e.key==='Escape')closeDetail()};document.getElementById('theme').onclick=()=>document.documentElement.classList.toggle('dark');document.getElementById('search').oninput=render;document.getElementById('filter').onchange=render;render();
</script>
</body></html>
